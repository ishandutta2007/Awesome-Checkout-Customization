<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#4f46e5" fill-opacity="0.2" />
    </pattern>

    <!-- Subtle Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.18) translate(30px, -20px); opacity: 0.7; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-18px); opacity: 0.8; }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-purple {
      animation: pulseOrb 9s ease-in-out infinite;
      transform-origin: 250px 180px;
    }
    .orb-cyan {
      animation: pulseOrb 11s ease-in-out infinite reverse;
      transform-origin: 950px 220px;
    }
    .floating-dot-1 { animation: floatParticle 4s ease-in-out infinite; }
    .floating-dot-2 { animation: floatParticle 6s ease-in-out infinite 1s; }
    .floating-dot-3 { animation: floatParticle 5s ease-in-out infinite 2s; }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashFlow 20s linear infinite;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 50px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g filter="url(#glow)">
    <circle class="orb-purple" cx="220" cy="160" r="130" fill="#6366f1" opacity="0.4" />
    <circle class="orb-cyan" cx="980" cy="200" r="140" fill="#06b6d4" opacity="0.35" />
    <circle cx="600" cy="350" r="110" fill="#ec4899" opacity="0.2" />
  </g>

  <!-- Dynamic Flow Connector Curves in Middle Background -->
  <g fill="none" opacity="0.45">
    <path class="flow-line" d="M 80 80 Q 300 20 600 70 T 1120 90" stroke="#818cf8" stroke-width="2" />
    <path class="flow-line" d="M 100 360 Q 400 390 700 340 T 1100 350" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Subtle Floating Accent Dots -->
  <circle class="floating-dot-1" cx="160" cy="110" r="4" fill="#a855f7" />
  <circle class="floating-dot-2" cx="1060" cy="130" r="5" fill="#38bdf8" />
  <circle class="floating-dot-3" cx="920" cy="330" r="4.5" fill="#f43f5e" />
  <circle class="floating-dot-1" cx="280" cy="340" r="3.5" fill="#34d399" />

  <!-- Foreground Container Box with Subtle Border -->
  <rect x="70" y="45" width="1060" height="330" rx="16" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.2" stroke-opacity="0.8" filter="url(#pillShadow)" />

  <!-- Header Category Pill -->
  <g transform="translate(485, 75)">
    <rect width="230" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" class="badge-text" fill="#c7d2fe">CURATED AWESOME LIST</text>
  </g>

  <!-- Foreground Title -->
  <g transform="translate(600, 165)">
    <text text-anchor="middle" class="main-title" fill="url(#primaryGrad)">Awesome Checkout Customization</text>
  </g>

  <!-- Foreground Subtitle -->
  <g transform="translate(600, 205)">
    <text text-anchor="middle" class="subtitle">
      Logic Engines · Promotion Rules · Composable Commerce · Post-Purchase Upsells
    </text>
  </g>

  <!-- Feature Interactive/Pill Highlights in Foreground -->
  <g transform="translate(145, 260)">
    <!-- Pill 1: Pricing Rules -->
    <g transform="translate(0, 0)">
      <rect width="160" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="26" text-anchor="middle" class="badge-text">⚡ Pricing Engines</text>
    </g>

    <!-- Pill 2: Dynamic Upsells -->
    <g transform="translate(180, 0)">
      <rect width="170" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="85" y="26" text-anchor="middle" class="badge-text">🛍️ Post-Purchase Flow</text>
    </g>

    <!-- Pill 3: Composable APIs -->
    <g transform="translate(370, 0)">
      <rect width="175" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="87" y="26" text-anchor="middle" class="badge-text">🧩 Headless &amp; GraphQL</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(565, 0)">
      <rect width="165" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="82" y="26" text-anchor="middle" class="badge-text">🔓 Self-Hosted Stacks</text>
    </g>

    <!-- Pill 5: Validation Rules -->
    <g transform="translate(750, 0)">
      <rect width="160" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="26" text-anchor="middle" class="badge-text">🛡️ Cart Validation</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="70" y="372" width="1060" height="3" fill="url(#primaryGrad)" rx="1.5" />
</svg>
